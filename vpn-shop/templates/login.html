<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - VPN Shop</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="nav-logo">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 2L4 8V24L16 30L28 24V8L16 2Z" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M16 6L8 10V22L16 26L24 22V10L16 6Z" fill="currentColor" opacity="0.3"/>
                        <path d="M12 14L16 18L20 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 18V24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    VPN Shop
                </a>
                
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Главная</a></li>
                    <li><a href="#pricing" class="nav-link">Тарифы</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Login Form -->
    <section class="section">
        <div class="container" style="max-width: 450px;">
            <div class="card">
                <div class="card-header text-center">
                    <h2 class="card-title" style="margin: 0;">Вход в аккаунт</h2>
                    <p class="text-muted" style="margin-top: 0.5rem;">Введите данные для входа</p>
                </div>
                
                <div class="card-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                        </div>
                        
                        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" name="remember" checked>
                                <span style="font-size: 0.875rem; color: var(--color-text-light);">Запомнить меня</span>
                            </label>
                            <a href="#" style="font-size: 0.875rem;">Забыли пароль?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block btn-lg">
                            Войти
                        </button>
                    </form>
                    
                    <div id="errorContainer" class="alert alert-error hidden" style="margin-top: 1rem;"></div>
                </div>
                
                <div class="card-footer text-center">
                    <p class="text-muted" style="margin: 0;">
                        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" style="margin-top: auto;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 VPN Shop. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('[type="submit"]');
            const errorContainer = document.getElementById('errorContainer');
            
            UI.setButtonLoading(submitBtn, true);
            errorContainer.classList.add('hidden');
            
            try {
                const formData = new FormData(e.target);
                const data = {
                    email: formData.get('email'),
                    password: formData.get('password'),
                    remember: formData.get('remember') === 'on'
                };
                
                await Auth.login(data.email, data.password);
                
                UI.showNotification('Успешный вход!', 'success');
                window.location.href = '/dashboard';
            } catch (error) {
                errorContainer.textContent = error.message;
                errorContainer.classList.remove('hidden');
            } finally {
                UI.setButtonLoading(submitBtn, false);
            }
        });
    </script>
</body>
</html>

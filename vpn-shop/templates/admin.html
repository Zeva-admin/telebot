<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - VPN Shop</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="nav-logo">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 2L4 8V24L16 30L28 24V8L16 2Z" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M16 6L8 10V22L16 26L24 22V10L16 6Z" fill="currentColor" opacity="0.3"/>
                        <path d="M12 14L16 18L20 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 18V24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    VPN Shop Admin
                </a>
                
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">На сайт</a></li>
                    <li><a href="#stats" class="nav-link">Статистика</a></li>
                    <li><a href="#users" class="nav-link">Пользователи</a></li>
                    <li><a href="#subscriptions" class="nav-link">Подписки</a></li>
                    <li><a href="#" onclick="Auth.logout(); return false;" class="nav-link">Выход</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Stats Section -->
    <section id="stats" class="section section-alt">
        <div class="container">
            <h1 style="margin-bottom: 2rem;">Админ-панель</h1>
            
            <div class="grid grid-4" id="stats-container">
                <div class="card" style="text-align: center;">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Users Section -->
    <section id="users" class="section">
        <div class="container">
            <h2 style="margin-bottom: 1.5rem;">Пользователи</h2>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th>Имя</th>
                            <th>Роль</th>
                            <th>Дата регистрации</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="users-body">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 2rem;">
                                <div class="spinner" style="display: inline-block;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Subscriptions Section -->
    <section id="subscriptions" class="section section-alt">
        <div class="container">
            <h2 style="margin-bottom: 1.5rem;">Подписки</h2>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Пользователь</th>
                            <th>План</th>
                            <th>Статус</th>
                            <th>Начало</th>
                            <th>Окончание</th>
                        </tr>
                    </thead>
                    <tbody id="subscriptions-body">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 2rem;">
                                <div class="spinner" style="display: inline-block;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 VPN Shop Admin. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
    <script>
        // Загрузка статистики
        async function loadStats() {
            try {
                const response = await API.admin.getStats();
                const stats = response.data.stats;
                
                document.getElementById('stats-container').innerHTML = `
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 2.5rem; font-weight: 700; color: var(--color-primary);">${stats.total_users}</div>
                        <div class="text-muted">Всего пользователей</div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 2.5rem; font-weight: 700; color: var(--color-success);">${stats.active_subscriptions}</div>
                        <div class="text-muted">Активных подписок</div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 2.5rem; font-weight: 700; color: var(--color-accent);">${stats.successful_payments}</div>
                        <div class="text-muted">Успешных платежей</div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 2.5rem; font-weight: 700; color: var(--color-primary);">${UI.formatPrice(stats.total_revenue)}</div>
                        <div class="text-muted">Общая выручка</div>
                    </div>
                `;
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }
        
        // Загрузка пользователей
        async function loadUsers() {
            try {
                const response = await API.admin.getUsers(1, 50);
                const tbody = document.getElementById('users-body');
                
                if (response.data && response.data.items) {
                    tbody.innerHTML = response.data.items.map(user => `
                        <tr>
                            <td>#${user.id}</td>
                            <td>${escapeHtml(user.email)}</td>
                            <td>${escapeHtml(user.first_name || '')} ${escapeHtml(user.last_name || '')}</td>
                            <td>
                                <span class="status-badge ${user.is_admin ? 'status-active' : ''}">
                                    ${user.is_admin ? 'Админ' : 'Пользователь'}
                                </span>
                            </td>
                            <td>${UI.formatDate(user.created_at)}</td>
                            <td>
                                <button class="btn btn-sm btn-outline" onclick="toggleAdmin(${user.id})">
                                    ${user.is_admin ? 'Снять админа' : 'Сделать админом'}
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;" class="text-muted">Пользователи не найдены</td></tr>';
                }
            } catch (error) {
                console.error('Ошибка загрузки пользователей:', error);
            }
        }
        
        // Загрузка подписок
        async function loadSubscriptions() {
            try {
                const response = await API.admin.getSubscriptions(1, 50);
                const tbody = document.getElementById('subscriptions-body');
                
                if (response.data && response.data.items) {
                    tbody.innerHTML = response.data.items.map(sub => `
                        <tr>
                            <td>#${sub.id}</td>
                            <td>User #${sub.user_id}</td>
                            <td>${sub.plan ? sub.plan.name : 'План #' + sub.plan_id}</td>
                            <td><span class="status-badge status-${sub.status}">${getStatusText(sub.status)}</span></td>
                            <td>${UI.formatDate(sub.started_at)}</td>
                            <td>${UI.formatDate(sub.expires_at)}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;" class="text-muted">Подписки не найдены</td></tr>';
                }
            } catch (error) {
                console.error('Ошибка загрузки подписок:', error);
            }
        }
        
        // Переключение роли админа
        async function toggleAdmin(userId) {
            if (!confirm('Вы уверены?')) return;
            
            try {
                await fetch(`/api/admin/users/${userId}/toggle-admin`, { method: 'POST' });
                UI.showNotification('Роль изменена', 'success');
                loadUsers();
            } catch (error) {
                UI.showNotification(error.message, 'error');
            }
        }
        
        function getStatusText(status) {
            const texts = {
                'active': 'Активна',
                'pending': 'Ожидает',
                'expired': 'Истекла',
                'cancelled': 'Отменена'
            };
            return texts[status] || status;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadUsers();
            loadSubscriptions();
        });
    </script>
</body>
</html>

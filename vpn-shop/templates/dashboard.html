<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - VPN Shop</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="nav-logo">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 2L4 8V24L16 30L28 24V8L16 2Z" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M16 6L8 10V22L16 26L24 22V10L16 6Z" fill="currentColor" opacity="0.3"/>
                        <path d="M12 14L16 18L20 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 18V24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    VPN Shop
                </a>
                
                <button class="mobile-menu-btn" aria-label="Меню">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
                
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Главная</a></li>
                    <li><a href="#subscriptions" class="nav-link">Подписки</a></li>
                    <li><a href="#payments" class="nav-link">Платежи</a></li>
                    <li class="auth-logged-in"><span class="nav-link user-name"></span></li>
                    <li class="auth-logged-in"><a href="#" onclick="Auth.logout(); return false;" class="nav-link">Выход</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Dashboard Content -->
    <section class="section section-alt">
        <div class="container">
            <div class="grid grid-2" style="align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 style="margin: 0;">Личный кабинет</h1>
                    <p class="text-muted" style="margin: 0.5rem 0 0;">Управление подписками и настройками</p>
                </div>
                <div style="text-align: right;">
                    <a href="#pricing" class="btn btn-accent">Новая подписка</a>
                </div>
            </div>
            
            <!-- Subscriptions -->
            <div id="subscriptions" style="margin-bottom: 3rem;">
                <h2 style="margin-bottom: 1.5rem;">Мои подписки</h2>
                <div id="subscriptions-container">
                    <div class="card">
                        <div class="card-body" style="padding: 2rem; text-align: center;">
                            <div class="spinner"></div>
                            <p class="text-muted" style="margin-top: 1rem;">Загрузка...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Payment History -->
            <div id="payments">
                <h2 style="margin-bottom: 1.5rem;">История платежей</h2>
                <div class="table-container">
                    <table class="table" id="payments-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Дата</th>
                                <th>Сумма</th>
                                <th>Статус</th>
                                <th>Метод</th>
                            </tr>
                        </thead>
                        <tbody id="payments-body">
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 2rem;">
                                    <div class="spinner" style="display: inline-block;"></div>
                                    <p class="text-muted" style="margin-top: 1rem;">Загрузка...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- Config Modal -->
    <div id="config-modal" class="modal-overlay">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h3 style="margin: 0;">Конфигурация VPN</h3>
                <button class="modal-close" onclick="document.getElementById('config-modal').classList.remove('active'); document.body.style.overflow = '';">&times;</button>
            </div>
            <div id="config-content">
                <div class="spinner"></div>
                <p class="text-muted">Загрузка конфигурации...</p>
            </div>
            <div class="card-footer" style="display: flex; gap: 1rem; justify-content: flex-end; border-top: 1px solid var(--color-border); padding-top: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-outline" onclick="copyConfig()">Копировать</button>
                <button class="btn btn-primary" onclick="downloadConfig()">Скачать файл</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" style="margin-top: auto;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 VPN Shop. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
    <script>
        let currentConfig = '';
        let currentSubscriptionId = null;
        
        // Загрузка подписок
        async function loadSubscriptions() {
            try {
                const response = await API.subscriptions.getAll();
                const container = document.getElementById('subscriptions-container');
                
                if (response.data && response.data.subscriptions && response.data.subscriptions.length > 0) {
                    container.innerHTML = '<div class="grid grid-2">' + response.data.subscriptions.map(sub => `
                        <div class="card">
                            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                                <h4 class="card-title" style="margin: 0; font-size: 1.125rem;">${sub.plan ? sub.plan.name : 'План #' + sub.plan_id}</h4>
                                <span class="status-badge status-${sub.status}">${getStatusText(sub.status)}</span>
                            </div>
                            <div class="card-body">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                                    <div>
                                        <span class="text-muted" style="font-size: 0.75rem;">Начало</span>
                                        <div>${UI.formatDate(sub.started_at)}</div>
                                    </div>
                                    <div>
                                        <span class="text-muted" style="font-size: 0.75rem;">Окончание</span>
                                        <div>${UI.formatDate(sub.expires_at)}</div>
                                    </div>
                                </div>
                                ${sub.plan ? `
                                <ul class="price-features" style="margin: 1rem 0; font-size: 0.875rem;">
                                    <li>📱 ${sub.plan.max_devices} устройств</li>
                                    <li>⚡ ${sub.plan.speed_limit_mbps ? sub.plan.speed_limit_mbps + ' Мбит/с' : 'Безлимит'}</li>
                                </ul>` : ''}
                            </div>
                            <div class="card-footer" style="display: flex; gap: 0.5rem;">
                                ${sub.status === 'active' ? `
                                <button class="btn btn-primary btn-sm" onclick="showConfig(${sub.id})">Конфигурация</button>
                                <button class="btn btn-outline btn-sm" onclick="renewSubscription(${sub.id})">Продлить</button>
                                ` : ''}
                                ${sub.status === 'active' ? `<button class="btn btn-outline btn-sm" style="margin-left: auto;" onclick="cancelSubscription(${sub.id})">Отменить</button>` : ''}
                            </div>
                        </div>
                    `).join('') + '</div>';
                } else {
                    container.innerHTML = `
                        <div class="card" style="text-align: center; padding: 3rem;">
                            <svg style="width: 64px; height: 64px; color: var(--color-text-light); margin-bottom: 1rem;" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="12" y="20" width="40" height="28" rx="4"/>
                                <path d="M24 20V16a8 8 0 0116 0v4"/>
                            </svg>
                            <h3 style="margin-bottom: 0.5rem;">Нет активных подписок</h3>
                            <p class="text-muted" style="margin-bottom: 1.5rem;">Выберите тарифный план для начала использования сервиса</p>
                            <a href="#pricing" class="btn btn-accent">Выбрать тариф</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Ошибка загрузки подписок:', error);
            }
        }
        
        // Загрузка платежей
        async function loadPayments() {
            try {
                const response = await API.payments.getAll();
                const tbody = document.getElementById('payments-body');
                
                if (response.data && response.data.payments && response.data.payments.length > 0) {
                    tbody.innerHTML = response.data.payments.map(payment => `
                        <tr>
                            <td>#${payment.id}</td>
                            <td>${UI.formatDate(payment.created_at)}</td>
                            <td>${UI.formatPrice(payment.amount, payment.currency)}</td>
                            <td><span class="status-badge status-${payment.status}">${getStatusText(payment.status)}</span></td>
                            <td>${payment.payment_method || '—'}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;" class="text-muted">История платежей пуста</td></tr>';
                }
            } catch (error) {
                console.error('Ошибка загрузки платежей:', error);
            }
        }
        
        // Показать конфиг
        async function showConfig(subscriptionId) {
            currentSubscriptionId = subscriptionId;
            const modal = document.getElementById('config-modal');
            const content = document.getElementById('config-content');
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            try {
                const response = await API.subscriptions.getConfig(subscriptionId);
                currentConfig = response.data.config;
                
                content.innerHTML = `
                    <div style="background: var(--color-bg-dark); border-radius: var(--radius-md); padding: 1rem; overflow-x: auto;">
                        <pre style="margin: 0; color: #a0aec0; font-size: 0.875rem; font-family: 'Courier New', monospace;">${escapeHtml(currentConfig)}</pre>
                    </div>
                    <p class="text-muted" style="margin-top: 1rem; font-size: 0.875rem;">
                        Используйте этот конфиг в приложении WireGuard или другом совместимом клиенте.
                    </p>
                `;
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Ошибка загрузки конфигурации: ${error.message}</div>`;
            }
        }
        
        // Копировать конфиг
        function copyConfig() {
            navigator.clipboard.writeText(currentConfig).then(() => {
                UI.showNotification('Конфигурация скопирована в буфер обмена', 'success');
            });
        }
        
        // Скачать конфиг
        function downloadConfig() {
            const blob = new Blob([currentConfig], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vpn_subscription_${currentSubscriptionId}.conf`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Продлить подписку
        async function renewSubscription(id) {
            if (!confirm('Продлить подписку?')) return;
            
            try {
                await API.subscriptions.renew(id);
                UI.showNotification('Подписка продлена', 'success');
                loadSubscriptions();
            } catch (error) {
                UI.showNotification(error.message, 'error');
            }
        }
        
        // Отменить подписку
        async function cancelSubscription(id) {
            if (!confirm('Вы уверены, что хотите отменить подписку?')) return;
            
            try {
                await API.subscriptions.cancel(id);
                UI.showNotification('Подписка отменена', 'success');
                loadSubscriptions();
            } catch (error) {
                UI.showNotification(error.message, 'error');
            }
        }
        
        function getStatusText(status) {
            const texts = {
                'active': 'Активна',
                'pending': 'Ожидает',
                'expired': 'Истекла',
                'cancelled': 'Отменена',
                'success': 'Успешно',
                'failed': 'Ошибка',
                'refunded': 'Возврат'
            };
            return texts[status] || status;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadSubscriptions();
            loadPayments();
        });
    </script>
</body>
</html>
